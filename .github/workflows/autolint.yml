name: autofix lint errors in cave game, pretiter

on:
  push:
    branches:
      - main  # or the branch you want to monitor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-revert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: npm run format
      run: |
        git config user.name "Thomas A. Powell"
        git config user.email "tpowell@pint.com"

        npm install || true
        npm run format || true

        git add . 
        git commit -m "Format code"  || true

        # Push the revert commits
        git push origin HEAD
